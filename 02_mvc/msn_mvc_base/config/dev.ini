;mysql_path = "/Applications/XAMPP/xamppfiles/bin/"


[Controllers]
default_controller = main

[Web]
web_root = "/04_msn_mvc_base/"

[Validation]
pseudo_min_length = 3
pseudo_max_length = 16
password_min_length = 8
password_max_length = 16
; Motifs sans délimiteurs PHP. Le code les entoure de #...#. Ne pas mettre de # dans le motif.
; [\W_] = caractère spécial (\W) ou underscore.
pseudo_pattern = "^[a-zA-Z][a-zA-Z0-9]*$"
password_pattern = "^(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).+$"

[JavaScript]
disable_js = true
